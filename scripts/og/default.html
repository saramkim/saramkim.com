<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="og.css" />
    <style>
      .brand {
        margin-top: 52px;
        height: 30px;
        filter: brightness(0) invert(1);
      }
      .main {
        margin-top: 88px;
      }
      .main .label {
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bokeh">
        <i style="--x: 330px; --y: -150px; --s: 560px; --t: radial-gradient(closest-side, #e8742c, transparent); --a: 0.55"></i>
        <i style="--x: 560px; --y: -40px; --s: 640px; --t: radial-gradient(closest-side, #0f8f99, transparent); --a: 0.6"></i>
        <i style="--x: 140px; --y: 120px; --s: 440px; --t: radial-gradient(closest-side, #1b4fa8, transparent); --a: 0.65"></i>
        <i style="--x: 880px; --y: 70px; --s: 72px; --t: #ffc56b; --a: 0.75"></i>
        <i style="--x: 1010px; --y: 150px; --s: 112px; --t: #ff9a4d; --a: 0.4"></i>
        <i style="--x: 760px; --y: 250px; --s: 96px; --t: #62e0dc; --a: 0.32"></i>
        <i style="--x: 1090px; --y: 330px; --s: 56px; --t: #ffe9b0; --a: 0.7"></i>
        <i style="--x: 900px; --y: 360px; --s: 80px; --t: #ff6f61; --a: 0.34"></i>
        <i style="--x: 190px; --y: 90px; --s: 56px; --t: #ffe9b0; --a: 0.6"></i>
        <i style="--x: 60px; --y: 260px; --s: 88px; --t: #79d7ff; --a: 0.34"></i>
      </div>
      <div class="scrim"></div>
      <div class="grain"></div>
      <div class="stack">
        <img class="brand" src="../../public/brand/wordmark.svg" alt="" />
        <div class="main">
          <h1>
            보던 영상 그대로,<br />
            <span>자막만 내 방식대로.</span>
          </h1>
          <p class="label">Play Plus · WebSubtitle</p>
        </div>
      </div>
      <div class="player">
        <div class="track">
          <div class="loop"><b>A</b><b>B</b></div>
          <div class="head"></div>
        </div>
        <div class="controls"><span>00:12:04.0</span><span>saramkim.com</span></div>
      </div>
    </div>
  </body>
</html>
