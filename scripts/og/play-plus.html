<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="og.css" />
    <style>
      h1 {
        font-size: 62px;
      }
      .id {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-top: 44px;
      }
      .id img {
        width: 52px;
        height: 52px;
        border-radius: 14px;
      }
      .main {
        margin-top: 44px;
      }
      .subs {
        margin-top: 34px;
        text-shadow: 0 2px 10px #000;
      }
      .subs .en {
        font-size: 30px;
        font-weight: 650;
        line-height: 1.35;
        color: var(--accent);
      }
      .subs .ko {
        margin-top: 4px;
        font-size: 22px;
        line-height: 1.4;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Same lights as the Play Plus hero screen (.play-screen in app/globals.css). -->
      <div class="bokeh">
        <i style="--x: 760px; --y: -120px; --s: 560px; --t: radial-gradient(closest-side, #0f8f99, transparent); --a: 0.6"></i>
        <i style="--x: 180px; --y: -150px; --s: 520px; --t: radial-gradient(closest-side, #e8742c, transparent); --a: 0.5"></i>
        <i style="--x: 340px; --y: 40px; --s: 520px; --t: radial-gradient(closest-side, #1b4fa8, transparent); --a: 0.6"></i>
        <i style="--x: 900px; --y: 90px; --s: 76px; --t: #62e0dc; --a: 0.4"></i>
        <i style="--x: 1040px; --y: 200px; --s: 110px; --t: #79d7ff; --a: 0.32"></i>
        <i style="--x: 120px; --y: 120px; --s: 84px; --t: #ffc56b; --a: 0.55"></i>
        <i style="--x: 1100px; --y: 360px; --s: 56px; --t: #ffe9b0; --a: 0.6"></i>
        <i style="--x: 80px; --y: 300px; --s: 100px; --t: #ff9a4d; --a: 0.3"></i>
      </div>
      <div class="scrim"></div>
      <div class="grain"></div>
      <div class="stack">
        <div class="id">
          <img src="../../public/products/play-plus.png" alt="" />
          <p class="label">Play Plus · Chrome extension</p>
        </div>
        <div class="main">
          <h1>
            보던 쿠팡플레이가,<br />
            <span>언어 공부가 됩니다.</span>
          </h1>
        </div>
        <div class="subs">
          <p class="en" lang="en">I finally caught that line.</p>
          <p class="ko">이제야 그 문장이 들렸어.</p>
        </div>
      </div>
      <div class="player">
        <div class="track">
          <div class="loop"><b>A</b><b>B</b></div>
          <div class="head"></div>
        </div>
        <div class="controls"><span>00:12:04.0</span><span>A–B ×3</span></div>
      </div>
    </div>
  </body>
</html>
